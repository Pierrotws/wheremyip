name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created == 'true' }}

      - name: Build extension bundle
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: make pack

      - name: Attach bundle to the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" wheremyip@pierrotws.github.com.shell-extension.zip --clobber

      # release-please only rewrites string values in JSON files, so the
      # integer metadata.json version is set on the release PR here.
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Set metadata.json version on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          version=$(jq -r '.["."] | split(".")[0]' .release-please-manifest.json)
          sed -i -E "s/(\"version\": )[0-9]+/\1${version}/" metadata.json
          /usr/bin/git diff --quiet && exit 0
          /usr/bin/git config user.name "github-actions[bot]"
          /usr/bin/git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          /usr/bin/git commit -am "chore: set metadata.json version to ${version}"
          /usr/bin/git push
